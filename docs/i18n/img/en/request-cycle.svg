<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 902" width="980" height="902" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Request Cycle</title>
<desc>How one web request obtains the guard, burns an ID and returns</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="902" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Request Cycle</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">How one web request obtains the guard, burns an ID and returns</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="816.0" y="36.0" width="124.0" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<circle cx="831.0" cy="49.0" r="1.9" fill="#2563eb"/><g transform="rotate(0 831.0 49.0)"><line x1="833.6" y1="49.0" x2="839.0" y2="49.0" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="47.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="51.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/></g><g transform="rotate(60 831.0 49.0)"><line x1="833.6" y1="49.0" x2="839.0" y2="49.0" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="47.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="51.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/></g><g transform="rotate(120 831.0 49.0)"><line x1="833.6" y1="49.0" x2="839.0" y2="49.0" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="47.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="51.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/></g><g transform="rotate(180 831.0 49.0)"><line x1="833.6" y1="49.0" x2="839.0" y2="49.0" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="47.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="51.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/></g><g transform="rotate(240 831.0 49.0)"><line x1="833.6" y1="49.0" x2="839.0" y2="49.0" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="47.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="51.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/></g><g transform="rotate(300 831.0 49.0)"><line x1="833.6" y1="49.0" x2="839.0" y2="49.0" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="47.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/><line x1="836.0" y1="49.0" x2="838.1" y2="51.0" stroke="#2563eb" stroke-width="1.20" stroke-linecap="round"/></g>
<text x="883.0053750000001" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-rust</text>
<rect x="650.0" y="120.0" width="290.0" height="218.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="218.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="13.0" fill="#0f1e33" font-weight="700">Eight ways in, one guard</text>
<text x="665" y="166.0" font-size="10.5" fill="#3d4d66" font-weight="400">axum · with_state → FromRequestParts</text>
<text x="665" y="181.75" font-size="10.5" fill="#3d4d66" font-weight="400">actix-web · app_data → FromRequest</text>
<text x="665" y="197.5" font-size="10.5" fill="#3d4d66" font-weight="400">rocket · manage → request guard</text>
<text x="665" y="213.25" font-size="10.5" fill="#3d4d66" font-weight="400">poem · data → FromRequest</text>
<text x="665" y="229.0" font-size="10.5" fill="#3d4d66" font-weight="400">salvo · affix_state::inject → Extractible</text>
<text x="665" y="244.75" font-size="10.5" fill="#3d4d66" font-weight="400">warp · with_guard combinator → closure</text>
<text x="665" y="260.5" font-size="10.5" fill="#3d4d66" font-weight="400">bee-rust · reuses axum (state via State)</text>
<text x="665" y="276.25" font-size="10.5" fill="#3d4d66" font-weight="400">e-cat · GuardLayer → Extension&lt;Guard&gt;</text>
<rect x="650.0" y="354.0" width="290.0" height="152.0" rx="12" fill="#f3fbf8" stroke="#a9dcd0" stroke-width="1.5"/>
<rect x="650.0" y="354.0" width="4.0" height="152.0" rx="2" fill="#0f766e"/>
<text x="665" y="378" font-size="13.0" fill="#0f1e33" font-weight="700">Zero cost per request</text>
<text x="665" y="400.0" font-size="11.5" fill="#3d4d66" font-weight="400">Extraction = one Arc refcount bump, no state</text>
<text x="665" y="417.25" font-size="11.5" fill="#3d4d66" font-weight="400">copy</text>
<text x="665" y="434.5" font-size="11.5" fill="#3d4d66" font-weight="400">One generator state for the whole process,</text>
<text x="665" y="451.75" font-size="11.5" fill="#3d4d66" font-weight="400">one lock</text>
<text x="665" y="469.0" font-size="11.5" fill="#3d4d66" font-weight="400">No .await inside the lock; waiting happens only</text>
<text x="665" y="486.25" font-size="11.5" fill="#3d4d66" font-weight="400">on drift or exhaustion</text>
<rect x="650.0" y="522.0" width="290.0" height="136.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="522.0" width="4.0" height="136.0" rx="2" fill="#b45309"/>
<text x="665" y="546" font-size="13.0" fill="#0f1e33" font-weight="700">Forgot to register = wiring bug</text>
<text x="665" y="568.0" font-size="11.5" fill="#3d4d66" font-weight="400">Translates into a 500, not a 4xx</text>
<text x="665" y="585.25" font-size="11.5" fill="#3d4d66" font-weight="400">The response names the manage / app_data /</text>
<text x="665" y="602.5" font-size="11.5" fill="#3d4d66" font-weight="400">with_state step to check</text>
<rect x="650.0" y="674.0" width="290.0" height="132.0" rx="12" fill="#fdf3f3" stroke="#f4c2c2" stroke-width="1.5"/>
<rect x="650.0" y="674.0" width="4.0" height="132.0" rx="2" fill="#dc2626"/>
<text x="665" y="698" font-size="13.0" fill="#0f1e33" font-weight="700">Generation failures belong to the app</text>
<text x="665" y="720.0" font-size="11.5" fill="#3d4d66" font-weight="400">Clock drift and epoch exhaustion return Err</text>
<text x="665" y="737.25" font-size="11.5" fill="#3d4d66" font-weight="400">inside the handler</text>
<text x="665" y="754.5" font-size="11.5" fill="#3d4d66" font-weight="400">Whether that becomes 500, 503 or a fallback</text>
<text x="665" y="771.75" font-size="11.5" fill="#3d4d66" font-weight="400">is the app&#x27;s call</text>
<rect x="220.0" y="120.0" width="260.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">app boots</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">build Snowflake → wrap as Guard</text>
<path d="M350.0,230.0 L350.0,254.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="254.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="283.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">register into app state</text>
<path d="M350.0,304.0 L350.0,328.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="328.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="357.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">request reaches the handler</text>
<path d="M350.0,378.0 L350.0,402.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="402.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="431.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">framework extractor clones the guard</text>
<path d="M350.0,452.0 L350.0,476.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="476.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="505.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">guard.id() generates the ID</text>
<path d="M350.0,526.0 L350.0,550.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="550.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="572.6881047239613" font-size="10.2" fill="#fff" font-weight="600" text-anchor="middle">response returns; the ID is monotonic, unique across threads</text>
<text x="40" y="884" font-size="11.5" fill="#93a3b8" font-weight="400">© 2026 erik — https://erik.xyz</text><text x="940" y="884" font-size="11.5" fill="#93a3b8" font-weight="600" text-anchor="end">snowflake-rust</text>
</svg>
