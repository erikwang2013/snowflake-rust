<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 866" width="980" height="866" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Feature Design</title>
<desc>Three capability domains, nine core features</desc>
<defs>
</defs>
<rect width="980" height="866" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Feature Design</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Three capability domains, nine core features</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="832.0" y="36.0" width="108.0" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="886.005375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-rust</text>
<rect x="40.0" y="120.0" width="286.7" height="652.0" rx="14" fill="#f8fbff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="56.0" y="136.0" width="57.0" height="28.0" rx="14.0" fill="#2563eb"/><text x="84.503125" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Core</text>
<rect x="56.0" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="184.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Unique ID generation</text>
<rect x="71.0" y="216.0" width="93.3" height="18.0" rx="9" fill="#f8fbff"/>
<text x="117.642625" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · next_id()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64-bit, k-ordered, globally unique; 4M+</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">per second per node, no central</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">coordinator and no database</text>
<text x="71.0" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">round-trips.</text>
<rect x="56.0" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="378.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Flexible bit allocation</text>
<rect x="71.0" y="410.0" width="171.6" height="18.0" rx="9" fill="#f8fbff"/>
<text x="156.781375" y="423" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">worker_bits · datacenter_bits</text>
<text x="71.0" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">Timestamp / datacenter / worker /</text>
<text x="71.0" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">sequence widths are all adjustable; the</text>
<text x="71.0" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">default 5+5+12 supports 1024 nodes.</text>
<text x="71.0" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">Every bit borrowed shortens the</text>
<text x="71.0" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">lifespan — check with lifespan_ms()</text>
<text x="71.0" y="530.25" font-size="11.5" fill="#3d4d66" font-weight="400">first.</text>
<rect x="56.0" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="572.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">ID decomposition</text>
<rect x="71.0" y="604.0" width="121.3" height="18.0" rx="9" fill="#f8fbff"/>
<text x="131.644375" y="617" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">parse_id() · parse()</text>
<text x="71.0" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Turn a generated ID back into</text>
<text x="71.0" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">timestamp, datacenter, worker and</text>
<text x="71.0" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">sequence — for debugging and sharding.</text>
<text x="71.0" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">datetime is UTC, stable across</text>
<text x="71.0" y="707.0" font-size="11.5" fill="#3d4d66" font-weight="400">machines.</text>
<rect x="346.7" y="120.0" width="286.7" height="652.0" rx="14" fill="#f6fdfe" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="362.7" y="136.0" width="93.2" height="28.0" rx="14.0" fill="#0e7490"/><text x="409.2822916666667" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Extensions</text>
<rect x="362.7" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="184.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Pluggable sequence resolvers</text>
<rect x="377.7" y="216.0" width="109.2" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="432.2472916666667" y="229" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">SequenceResolver</text>
<text x="377.6666666666667" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">The sequence strategy is a trait:</text>
<text x="377.6666666666667" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">sequential, random and Redis ship built</text>
<text x="377.6666666666667" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">in; implement SequenceResolver to plug</text>
<text x="377.6666666666667" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">in your own without touching the core.</text>
<rect x="362.7" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="378.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Clock drift protection</text>
<rect x="377.7" y="410.0" width="117.9" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="436.6021666666667" y="423" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">clock_tolerance_ms</text>
<text x="377.6666666666667" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">A configurable tolerance window absorbs</text>
<text x="377.6666666666667" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">NTP jitter; beyond it</text>
<text x="377.6666666666667" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">clock_drift_strategy decides: wait spins</text>
<text x="377.6666666666667" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">until the clock catches up (within</text>
<text x="377.6666666666667" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">budget), throw refuses to generate.</text>
<rect x="362.7" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="572.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Framework integration</text>
<rect x="377.7" y="604.0" width="105.6" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="430.4832916666667" y="617" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">Guard · Guarded</text>
<text x="377.6666666666667" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Eight opt-in adapters: axum, actix-web,</text>
<text x="377.6666666666667" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">rocket, poem, salvo, warp, bee-rust and</text>
<text x="377.6666666666667" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">e-cat. A handler declares a Guard</text>
<text x="377.6666666666667" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">parameter and generates IDs; a</text>
<text x="377.6666666666667" y="707.0" font-size="11.5" fill="#3d4d66" font-weight="400">missing registration is a 500.</text>
<rect x="653.3" y="120.0" width="286.7" height="652.0" rx="14" fill="#fbf9ff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="669.3" y="136.0" width="100.2" height="28.0" rx="14.0" fill="#6d28d9"/><text x="719.4270833333334" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Engineering</text>
<rect x="669.3" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="184.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Strict config validation</text>
<rect x="684.3" y="216.0" width="102.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="735.4410833333334" y="229" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">SnowflakeBuilder</text>
<text x="684.3333333333334" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">Two entry points — builder and</text>
<text x="684.3333333333334" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">environment — validate bit widths and</text>
<text x="684.3333333333334" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">node ranges at startup and reject</text>
<text x="684.3333333333334" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">illegal combinations, naming the</text>
<text x="684.3333333333334" y="319.0" font-size="11.5" fill="#3d4d66" font-weight="400">offending key instead of silently</text>
<text x="684.3333333333334" y="336.25" font-size="11.5" fill="#3d4d66" font-weight="400">defaulting.</text>
<rect x="669.3" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="378.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Concurrency safety</text>
<rect x="684.3" y="410.0" width="147.9" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="758.2628333333333" y="423" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">Shared · Arc&lt;Mutex&lt;…&gt;&gt;</text>
<text x="684.3333333333334" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">id() takes &amp;mut self: the cross-thread</text>
<text x="684.3333333333334" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">sharing the PHP version warns about</text>
<text x="684.3333333333334" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">does not compile here. Share through</text>
<text x="684.3333333333334" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">Shared / Guard — no .await inside the</text>
<text x="684.3333333333334" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">lock.</text>
<rect x="669.3" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="572.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Quality &amp; delivery</text>
<rect x="684.3" y="604.0" width="116.5" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="742.6073333333334" y="617" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">cargo test · bench</text>
<text x="684.3333333333334" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">89 tests (8-thread uniqueness, all</text>
<text x="684.3333333333334" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">three drift states, a fake Redis client),</text>
<text x="684.3333333333334" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">a reproducible benchmark, bilingual</text>
<text x="684.3333333333334" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">docs and the project mascot.</text>
<text x="40" y="796" font-size="11.5" fill="#6b7c96" font-weight="400">Requirements: Rust &gt;= 1.88 (edition 2024) · any platform (i64) · one instance state per process; share across threads with Shared / Guard</text>
<text x="40" y="848" font-size="11.5" fill="#93a3b8" font-weight="400">© 2026 erik — https://erik.xyz</text><text x="940" y="848" font-size="11.5" fill="#93a3b8" font-weight="600" text-anchor="end">snowflake-rust</text>
</svg>
