<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 866" width="980" height="866" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>功能设计</title>
<desc>三大能力域，九项核心功能</desc>
<defs>
</defs>
<rect width="980" height="866" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">功能设计</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">三大能力域，九项核心功能</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="832.0" y="36.0" width="108.0" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="886.005375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-rust</text>
<rect x="40.0" y="120.0" width="286.7" height="652.0" rx="14" fill="#f8fbff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="56.0" y="136.0" width="80.5" height="28.0" rx="14.0" fill="#2563eb"/><text x="96.25" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">核心能力</text>
<rect x="56.0" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="184.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">唯一 ID 生成</text>
<rect x="71.0" y="216.0" width="93.3" height="18.0" rx="9" fill="#f8fbff"/>
<text x="117.642625" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · next_id()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64 位、k-ordered、全局唯一；单节点每</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">秒 400 万以上，无中心协调节点、无数据</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">库往返。</text>
<rect x="56.0" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="378.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">弹性位分配</text>
<rect x="71.0" y="410.0" width="171.6" height="18.0" rx="9" fill="#f8fbff"/>
<text x="156.781375" y="423" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">worker_bits · datacenter_bits</text>
<text x="71.0" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">时间戳/数据中心/节点/序列号位宽均可调</text>
<text x="71.0" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">整，默认 5+5+12 支持 1024 个节点。向</text>
<text x="71.0" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">节点或序列号借位会缩短寿命，用</text>
<text x="71.0" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">lifespan_ms() 先算再选。</text>
<rect x="56.0" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="572.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">ID 反向解析</text>
<rect x="71.0" y="604.0" width="121.3" height="18.0" rx="9" fill="#f8fbff"/>
<text x="131.644375" y="617" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">parse_id() · parse()</text>
<text x="71.0" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">将生成的 ID 还原为时间戳、数据中心、节</text>
<text x="71.0" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">点与序列号，便于排障与数据分片；</text>
<text x="71.0" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">datetime 输出 UTC，跨机器对账稳定。</text>
<rect x="346.7" y="120.0" width="286.7" height="652.0" rx="14" fill="#f6fdfe" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="362.7" y="136.0" width="80.5" height="28.0" rx="14.0" fill="#0e7490"/><text x="402.9166666666667" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">扩展能力</text>
<rect x="362.7" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="184.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">可插拔序列策略</text>
<rect x="377.7" y="216.0" width="109.2" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="432.2472916666667" y="229" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">SequenceResolver</text>
<text x="377.6666666666667" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">序列号策略是一个 trait：顺序、随机、</text>
<text x="377.6666666666667" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">Redis 三种已内置；自定义策略实现</text>
<text x="377.6666666666667" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">SequenceResolver 即可接入。</text>
<rect x="362.7" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="378.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">时钟回拨保护</text>
<rect x="377.7" y="410.0" width="117.9" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="436.6021666666667" y="423" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">clock_tolerance_ms</text>
<text x="377.6666666666667" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">可配置的容忍窗口吸收 NTP 抖动；超出后</text>
<text x="377.6666666666667" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">由 clock_drift_strategy 决定：wait 自旋</text>
<text x="377.6666666666667" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">等待追平（带预算），throw 拒绝生成。</text>
<rect x="362.7" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="572.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">框架集成</text>
<rect x="377.7" y="604.0" width="105.6" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="430.4832916666667" y="617" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">Guard · Guarded</text>
<text x="377.6666666666667" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">axum、actix-web、rocket、poem、salvo</text>
<text x="377.6666666666667" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">、warp、bee-rust、e-cat 八个 opt-in 适</text>
<text x="377.6666666666667" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">配；处理器声明 Guard 参数即发号，缺注</text>
<text x="377.6666666666667" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">册返回 500。</text>
<rect x="653.3" y="120.0" width="286.7" height="652.0" rx="14" fill="#fbf9ff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="669.3" y="136.0" width="80.5" height="28.0" rx="14.0" fill="#6d28d9"/><text x="709.5833333333334" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">工程保障</text>
<rect x="669.3" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="184.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">严格配置校验</text>
<rect x="684.3" y="216.0" width="102.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="735.4410833333334" y="229" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">SnowflakeBuilder</text>
<text x="684.3333333333334" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">构建器与环境变量两个入口，启动即校验位</text>
<text x="684.3333333333334" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">数与节点范围，拒绝非法组合；错误信息点</text>
<text x="684.3333333333334" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">名具体配置项，不静默兜底。</text>
<rect x="669.3" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="378.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">并发安全</text>
<rect x="684.3" y="410.0" width="147.9" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="758.2628333333333" y="423" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">Shared · Arc&lt;Mutex&lt;…&gt;&gt;</text>
<text x="684.3333333333334" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">id() 需要 &amp;mut self：PHP 版警告的跨线程</text>
<text x="684.3333333333334" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">共享在这里编译不过；共享走 Shared /</text>
<text x="684.3333333333334" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">Guard，锁内没有 .await。</text>
<rect x="669.3" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="572.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">质量与交付</text>
<rect x="684.3" y="604.0" width="116.5" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="742.6073333333334" y="617" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">cargo test · bench</text>
<text x="684.3333333333334" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">89 项测试（8 线程并发唯一性、回拨三态</text>
<text x="684.3333333333334" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">、Redis 假客户端）、可复现基准、中英双</text>
<text x="684.3333333333334" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">语文档与项目宠物。</text>
<text x="40" y="796" font-size="11.5" fill="#6b7c96" font-weight="400">运行环境：Rust &gt;= 1.88（edition 2024） · 任意平台（i64） · 每进程一份实例状态，跨线程共享请用 Shared / Guard</text>
<text x="40" y="848" font-size="11.5" fill="#93a3b8" font-weight="400">© 2026 erik — https://erik.xyz</text><text x="940" y="848" font-size="11.5" fill="#93a3b8" font-weight="600" text-anchor="end">snowflake-rust</text>
</svg>
